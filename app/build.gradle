//file:noinspection GradleDependency
plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def keyProps = new Properties()
def keyPropsFile = rootProject.file('keystore/keystore.properties')
if (keyPropsFile.exists()) {
    keyProps.load(new FileInputStream(keyPropsFile))
}

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.1"

    defaultConfig {
        applicationId "cn.ppps.smscodetontfy"
        minSdkVersion 21
        targetSdkVersion 33
        // 版本号由 CI 打 tag 时通过 -PversionName/-PversionCode 传入（release.yml 解析 vX.Y.Z）；
        // 本地直接构建未传参时回退默认值，避免报错。
        versionCode (project.findProperty("versionCode") ?: "1").toString().toInteger()
        versionName (project.findProperty("versionName") ?: "1.0.0").toString()
    }

    signingConfigs {
        release {
            keyAlias keyProps['keyAlias']
            keyPassword keyProps['keyPassword']
            storeFile keyProps['storeFile'] ? file(keyProps['storeFile']) : null
            storePassword keyProps['storePassword']
        }
        debug {
            keyAlias keyProps['keyAlias']
            keyPassword keyProps['keyPassword']
            storeFile keyProps['storeFile'] ? file(keyProps['storeFile']) : null
            storePassword keyProps['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keyPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (keyPropsFile.exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        abortOnError false
    }
    namespace 'cn.ppps.smscodetontfy'
}

dependencies {
    // libxposed API 102 仅编译期依赖，运行时由 LSPosed 框架提供
    compileOnly 'io.github.libxposed:api:102.0.0'
}
